name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK bauen
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Familienstammbaum.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Familienstammbaum-APK
          path: Familienstammbaum.apk

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Familienstammbaum.apk \
            --title "Familienstammbaum 1.0.${{ github.run_number }}" \
            --notes "APK auf dem Android-Handy herunterladen und öffnen, um zu installieren oder zu aktualisieren." \
            --latest
