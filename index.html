<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Familienstammbaum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: Kopfzeile, Inhalt, untere Navigationsleiste wie bei Android; Details schieben sich als Ebenen darüber */
  --bg:#ECF0ED; --surface:#FFFFFF; --surface-2:#F4F7F5; --ink:#16201B; --muted:#5A6862; --line:#D2DBD6;
  --accent:#2B5A4C; --accent-ink:#FFFFFF; --accent-soft:#DBE9E2;
  --warm:#94621C; --warm-soft:#F4E8D2; --danger:#A8382A; --danger-soft:#F3D9D4;
  --branch:#93ADA2; --av-s:26%; --av-l:85%; --av-tl:27%;
  --shadow:0 1px 2px rgba(18,32,26,.06),0 4px 14px rgba(18,32,26,.08);
  --font-display:"Young Serif",Georgia,"Times New Roman",serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1311; --surface:#171F1B; --surface-2:#1E2823; --ink:#E5ECE8; --muted:#97A69F; --line:#2B3732;
    --accent:#8AC5AF; --accent-ink:#0C1914; --accent-soft:#1F352C;
    --warm:#E3B266; --warm-soft:#382D1B; --danger:#F08B79; --danger-soft:#3C221D;
    --branch:#4C695C; --av-s:20%; --av-l:25%; --av-tl:82%;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#171F1B; --surface-2:#1E2823; --ink:#E5ECE8; --muted:#97A69F; --line:#2B3732;
  --accent:#8AC5AF; --accent-ink:#0C1914; --accent-soft:#1F352C;
  --warm:#E3B266; --warm-soft:#382D1B; --danger:#F08B79; --danger-soft:#3C221D;
  --branch:#4C695C; --av-s:20%; --av-l:25%; --av-tl:82%;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}

#app{display:flex;flex-direction:column;height:100%}
.top{flex:none;display:flex;align-items:center;gap:8px;padding:10px 10px 6px 16px}
.tree-title{flex:1;min-width:0;display:flex;align-items:center;gap:6px;text-align:left;min-height:48px}
.tree-title span{font-family:var(--font-display);font-size:1.5rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-title .ic{color:var(--muted)}
.icon-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn:active{background:var(--surface-2)}
.icon-btn.solid{background:var(--accent);color:var(--accent-ink);border-radius:16px;width:52px;height:52px;box-shadow:var(--shadow)}
.banner{margin:0 16px 8px;padding:10px 14px;border-radius:12px;background:var(--warm-soft);font-size:.88rem}
main{flex:1;min-height:0;overflow:auto;position:relative}
main.no-scroll{overflow:hidden}
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;font-size:.76rem;font-weight:600;color:var(--muted)}
.tabs .pill{width:60px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .15s}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent)}

.view{padding:4px 16px 28px;max-width:760px;margin:0 auto}
.section-h{font-size:.76rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.list{overflow:hidden}
.search{position:sticky;top:0;z-index:2;background:var(--bg);padding:4px 0 6px}
.search,.layer-search{position:relative}
.search-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex;pointer-events:none}
.search input,.layer-search input{width:100%;height:50px;border-radius:25px;border:1px solid var(--line);background:var(--surface);padding:0 16px 0 46px;font:inherit;color:var(--ink)}
.layer-search{padding:0 16px 10px;flex:none}
.layer-search .search-ic{left:30px;top:25px}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:68px;width:100%;text-align:left;background:var(--surface)}
.row+.row{border-top:1px solid var(--line)}
.row .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row>.ic{color:var(--muted)}
.star{color:var(--warm)}
.av{--size:44px;width:var(--size);height:var(--size);border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;font-weight:700;font-size:calc(var(--size)*.36);letter-spacing:.02em;background:hsl(var(--h,150) var(--av-s) var(--av-l));color:hsl(var(--h,150) 42% var(--av-tl))}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.dead{filter:grayscale(.8)}

.bday-row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;margin:0 -16px;padding-left:16px;padding-right:16px}
.bday{flex:none;width:156px;padding:14px;border-radius:var(--r);background:var(--warm-soft);text-align:left;scroll-snap-align:start;display:flex;flex-direction:column;gap:4px}
.bday .av{margin-bottom:6px}
.bday .when{font-size:.8rem;font-weight:700;color:var(--warm)}
.bday .bn{font-weight:600;line-height:1.25}
.bday .bs{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Baum */
.tree-wrap{position:absolute;inset:0;display:flex;flex-direction:column}
.tree-bar{flex:none;display:flex;gap:8px;align-items:center;padding:2px 12px 10px;overflow-x:auto}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:22px;padding:3px;flex:none}
.seg button{height:36px;padding:0 14px;border-radius:18px;font-size:.86rem;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 4px;border-radius:22px;background:var(--surface);border:1px solid var(--line);font-size:.86rem;font-weight:600;flex:none;max-width:72vw}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .ic{width:18px;height:18px;color:var(--muted)}
.tree-vp{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(circle at 1px 1px,var(--line) 1.1px,transparent 0);background-size:24px 24px;border-top:1px solid var(--line)}
.tree-world{position:absolute;left:0;top:0;transform-origin:0 0}
.tree-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.tree-svg .ln{fill:none;stroke:var(--branch);stroke-width:2.4;stroke-linecap:round}
.tree-svg .cp{fill:none;stroke:var(--branch);stroke-width:2.4;stroke-linecap:round}
.tree-svg .ring{fill:none;stroke:var(--accent);stroke-width:2}
.node{position:absolute;width:96px;height:124px;display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:4px;text-align:center;border-radius:16px;user-select:none;-webkit-user-select:none}
.node .av{box-shadow:0 0 0 3px var(--bg),var(--shadow)}
.node.home .av{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--accent)}
.node.focus{background:var(--accent-soft)}
.node.focus .av{box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.node.focus.home .av{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 6px var(--accent)}
.node .nm{font-size:.78rem;font-weight:600;line-height:1.2;max-width:94px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;background:var(--bg);border-radius:6px;padding:0 3px}
.node.focus .nm{background:transparent}
.node .yr{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--bg);border-radius:6px;padding:0 3px}
.node.focus .yr{background:transparent}
.zoom{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:3}
.zoom button{width:46px;height:46px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}

/* Fotos */
.ph-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:14px;overflow:hidden}
@media (min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.grid button{aspect-ratio:1;background:var(--surface-2);overflow:hidden;display:block}
.grid img{width:100%;height:100%;object-fit:cover;display:block}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:25px;font-weight:600;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger);background:transparent;border-color:var(--danger-soft)}
.btn.danger-solid{background:var(--danger);color:#fff;border-color:transparent}
.btn.block{width:100%}
.btn.sm{min-height:42px;padding:0 16px;font-size:.9rem}
.btn[disabled]{opacity:.55}
.mini-btn{min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);font-size:.84rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;background:var(--surface)}
.mini-btn .ic{width:17px;height:17px}

/* Ebenen */
body.has-full #app{visibility:hidden}
.layer{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);animation:up .24s cubic-bezier(.2,.8,.2,1)}
.layer.push{animation:slide .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(28px);opacity:0}}
@keyframes slide{from{transform:translateX(34px);opacity:0}}
@keyframes fade{from{opacity:0}}
.layer-head{flex:none;display:flex;align-items:center;gap:2px;padding:6px 8px}
.layer-head h2{flex:1;margin:0 0 0 4px;font-size:1.08rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer-body{flex:1;min-height:0;overflow:auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.layer-body.narrow>*{max-width:640px;margin-left:auto;margin-right:auto}
.layer-foot{flex:none;display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.layer-foot .btn{flex:1}
.layer-foot .btn.primary{flex:2}
.layer.dlg{background:rgba(8,14,11,.5);justify-content:flex-end;animation:fade .18s}
.dlg-panel{width:100%;max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 0 calc(12px + env(safe-area-inset-bottom));max-height:88%;overflow:auto;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.dlg-title{padding:2px 20px 8px;font-family:var(--font-display);font-size:1.3rem;line-height:1.2}
.dlg-text{padding:0 20px 14px;color:var(--muted)}
.dlg-form{padding:0 20px}
.dlg-btns{display:flex;gap:10px;padding:10px 20px 6px}
.dlg-btns .btn{flex:1}
.dlg-sep{height:1px;background:var(--line);margin:6px 0}
.opt{display:flex;align-items:center;gap:16px;width:100%;min-height:58px;padding:6px 20px;text-align:left;font-weight:500}
.opt:active{background:var(--surface-2)}
.opt small{display:block;font-size:.8rem;color:var(--muted);font-weight:400}
.opt.danger{color:var(--danger)}
.opt.muted{color:var(--muted);justify-content:center}
.opt .ic-sp{width:22px;flex:none}
.opt .av{--size:34px}
.storage{padding:4px 20px 10px 58px;font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.layer,.layer.push,.dlg-panel,.layer.dlg{animation:none}}

/* Personenblatt */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 0 6px;gap:8px}
.hero-av{border-radius:50%;position:relative}
.hero-av .av{box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--line)}
.hero-av .cam{position:absolute;right:2px;bottom:2px;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.hero-av .cam .ic{width:18px;height:18px}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:2rem;line-height:1.1;margin:6px 0 0;text-wrap:balance}
.hero .bname{color:var(--muted);font-size:.92rem;margin-top:-4px}
.rel-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-size:.84rem;font-weight:600}
.rel-tag .ic{width:15px;height:15px}
.life{color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
.life .sym{font-family:var(--font-display);color:var(--ink);display:inline-block;width:1em}
.age{font-weight:600;color:var(--ink)}
.bday-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:16px;background:var(--warm-soft);color:var(--warm);font-weight:700;font-size:.85rem}
.bday-chip .ic{width:17px;height:17px}
.quick{display:flex;justify-content:center;gap:8px;margin:14px 0 2px;flex-wrap:wrap}
.q{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.76rem;font-weight:600;color:var(--accent);text-decoration:none;width:74px}
.q .qi{width:52px;height:52px;border-radius:18px;background:var(--accent-soft);display:grid;place-items:center}
.kv{padding:14px 16px}
.kv+.kv{border-top:1px solid var(--line)}
.kv .k{font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:2px}
.kv .v{white-space:pre-line;overflow-wrap:anywhere}
.kv .v.num{font-variant-numeric:tabular-nums;font-size:1.06rem}
.kv .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.fam{padding:14px 0 4px}
.fam-group+.fam-group{border-top:1px solid var(--line);padding-top:12px}
.fam-l{font-size:.78rem;color:var(--muted);font-weight:600;padding:0 16px 8px}
.fam-strip{display:flex;gap:6px;overflow-x:auto;padding:0 12px 12px}
.mini{flex:none;width:82px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:2px}
.mini .n{font-size:.8rem;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .r{font-size:.72rem;color:var(--muted)}
.mini.add .av{background:transparent;border:1.5px dashed var(--branch);color:var(--accent)}
.mini.add .n{color:var(--accent)}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.notes{padding:14px 16px;white-space:pre-line;overflow-wrap:anywhere}
.empty-note{color:var(--muted);font-size:.92rem;margin:6px 0}
.foot-acts{display:flex;flex-direction:column;gap:10px;margin:30px 0 8px}
.hint-card{padding:14px 16px;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.92rem;width:100%;text-align:left}
.hint-card .ic{color:var(--accent)}

/* Formular */
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0 0}
.field>label,.field>.lbl{font-size:.82rem;font-weight:600;color:var(--muted)}
.field input,.field textarea{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:11px 14px}
.field textarea{min-height:92px;resize:vertical;line-height:1.4}
.field .hint{font-size:.78rem;color:var(--muted)}
.field.err input,.field.err textarea{border-color:var(--danger)}
.errmsg{color:var(--danger);font-size:.82rem;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.two{grid-template-columns:1fr}}
.segctl{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.segctl button{min-height:46px;font-size:.84rem;font-weight:600;color:var(--muted);background:var(--surface)}
.segctl button+button{border-left:1px solid var(--line)}
.segctl button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.check{display:flex;align-items:center;gap:12px;min-height:50px;font-weight:500;margin-top:8px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.form-sec{margin-top:26px;border-top:1px solid var(--line)}
.form-sec .section-h{margin-top:18px;margin-bottom:0}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:10px;min-height:58px;padding:6px 4px 6px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.slot .t{flex:1;min-width:0;font-weight:600;display:flex;flex-direction:column}
.slot .t small{font-weight:400;color:var(--muted);font-size:.8rem}
.slot.empty{border-style:dashed;color:var(--accent);font-weight:600;padding-left:14px;width:100%;text-align:left}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.tick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tick .ic{width:16px;height:16px;stroke-width:2.6}

/* Fotoansicht */
.layer.lb{background:#0A0D0B;color:#ECF1EE}
.lb .icon-btn:active{background:rgba(255,255,255,.1)}
.lb-top{display:flex;align-items:center;gap:6px;padding:6px 8px;flex:none}
.lb-top .count{flex:1;text-align:center;font-size:.9rem;font-variant-numeric:tabular-nums;color:#AEBBB5}
.lb-stage{flex:1;min-height:0;position:relative;touch-action:pan-y;background-position:center;background-repeat:no-repeat;background-size:contain;display:grid;place-items:center;overflow:hidden}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:grid;place-items:center}
.lb-nav.prev{left:8px}.lb-nav.next{right:8px}
.lb-info{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.lb-cap{font-size:1rem;white-space:pre-line}
.lb-date{font-size:.85rem;color:#A3B2AB;font-variant-numeric:tabular-nums}
.lb-chips{display:flex;gap:8px;flex-wrap:wrap}
.lb-chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 3px;border-radius:18px;background:rgba(255,255,255,.1);font-size:.86rem;font-weight:600}
.lb-none{color:#A3B2AB;font-size:.88rem}
.lb-acts{display:flex;gap:4px;overflow-x:auto;justify-content:space-around}
.lb-acts button{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:74px;padding:4px;font-size:.74rem;font-weight:600;color:#D7E1DC}
.lb-acts .qi{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.09);display:grid;place-items:center}

/* Zustände */
.state{max-width:460px;margin:0 auto;padding:40px 24px;text-align:center}

.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto}

.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.has-act{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px}
.toast-btn{color:var(--accent-soft);font-weight:700;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.12);flex:none}
.trash-row{display:flex;align-items:center;gap:12px;padding:10px 12px}
.trash-row .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.trash-row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trash-row .s{font-size:.8rem;color:var(--muted)}
.av.trash-ph{overflow:hidden;border-radius:10px}
.av.trash-ph img{border-radius:10px}
.author-note{color:var(--muted);font-size:.8rem;text-align:center;margin:18px 8px 0}
.inrow{display:flex;gap:8px;align-items:center}

  background:conic-gradient(from 0deg,#F2C14E,#F78154,#E15A97,#B28DFF,#5DB7DE,#7BD389,#F2C14E);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));
  animation:bdaySpin 3.2s linear infinite}

<script>
(() => {
'use strict';
/* ---------- Ende-zu-Ende-Verschlüsselung ----------
 * Datenschlüssel K (AES-256-GCM) verschlüsselt alle Einträge. Jeder Zugang (Gerät, Einladung, Notfall-Schlüssel)
 * hat ein Schlüsselpaar (ECDH P-256). Sein privater Schlüssel liegt verschlüsselt bei Google, entschlüsselbar nur
 * mit dem Geheimnis aus dem Link bzw. auf dem Gerät. K liegt für jeden Zugang verschlüsselt bei Google (kw).
 * Fotos haben je einen eigenen Schlüssel, der im (verschlüsselten) Foto-Eintrag steht.
 */
const FSC = (() => {
  const CS = crypto.subtle;
  const TE = new TextEncoder(), TD = new TextDecoder();
  const SALT = TE.encode('familienstammbaum');
  const ECDH = { name: 'ECDH', namedCurve: 'P-256' };
  const u8 = x => (x instanceof Uint8Array ? x : new Uint8Array(x));
  function b64u(bytes) {
    const b = u8(bytes); let s = '';
    for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function unb64u(s) {
    s = String(s || '').replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const bin = atob(s); const a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  const b64 = bytes => { const s = b64u(bytes).replace(/-/g, '+').replace(/_/g, '/'); return s + '='.repeat((4 - (s.length % 4)) % 4); };
  const unb64 = s => unb64u(s);
  const rnd = n => crypto.getRandomValues(new Uint8Array(n));
  const id = (n = 12) => b64u(rnd(n));
  async function sha256hex(s) { const h = u8(await CS.digest('SHA-256', TE.encode(s))); return [...h].map(x => x.toString(16).padStart(2, '0')).join(''); }
  async function hkdf(secret, info) {
    const base = await CS.importKey('raw', typeof secret === 'string' ? TE.encode(secret) : secret, 'HKDF', false, ['deriveKey']);
    return CS.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: SALT, info: TE.encode(info) }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  const aesKey = raw => CS.importKey('raw', u8(raw), 'AES-GCM', false, ['encrypt', 'decrypt']);
  async function seal(key, bytes, aad) {
    const iv = rnd(12); const p = { name: 'AES-GCM', iv };
    if (aad) p.additionalData = TE.encode(aad);
    const ct = u8(await CS.encrypt(p, key, u8(bytes)));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
    return out;
  }
  async function unseal(key, data, aad) {
    data = u8(data); const p = { name: 'AES-GCM', iv: data.subarray(0, 12) };
    if (aad) p.additionalData = TE.encode(aad);
    return u8(await CS.decrypt(p, key, data.subarray(12)));
  }
  async function importPub(pub) { const j = typeof pub === 'string' ? JSON.parse(pub) : pub; return CS.importKey('jwk', { kty: 'EC', crv: 'P-256', x: j.x, y: j.y, ext: true }, ECDH, true, []); }
  /* Bytes so verschlüsseln, dass nur der Besitzer des privaten Schlüssels zu «pub» sie lesen kann */
  async function sealTo(pub, bytes, aad) {
    const eph = await CS.generateKey(ECDH, true, ['deriveBits']);
    const bits = u8(await CS.deriveBits({ name: 'ECDH', public: await importPub(pub) }, eph.privateKey, 256));
    const e = await CS.exportKey('jwk', eph.publicKey);
    return { e: { x: e.x, y: e.y }, c: b64u(await seal(await hkdf(bits, 'fs1|wrap'), bytes, aad)) };
  }
  async function openFrom(priv, box, aad) {
    const bits = u8(await CS.deriveBits({ name: 'ECDH', public: await importPub(box.e) }, priv, 256));
    return unseal(await hkdf(bits, 'fs1|wrap'), unb64u(box.c), aad);
  }
  const wrapKey = async (pub, K) => JSON.stringify(Object.assign({ v: K.v }, await sealTo(pub, K.raw, 'k' + K.v)));
  const authOf = secret => sha256hex('fs1|auth|' + secret);

  /* Neuer Zugang: Schlüsselpaar, privater Schlüssel mit dem Geheimnis verschlüsselt, K für diesen Zugang verpackt */
  async function makeCred(secret, K, credId) {
    const kp = await CS.generateKey(ECDH, true, ['deriveBits']);
    const pj = await CS.exportKey('jwk', kp.publicKey);
    const pub = JSON.stringify({ x: pj.x, y: pj.y });
    const pkcs8 = u8(await CS.exportKey('pkcs8', kp.privateKey));
    return {
      id: credId || id(12), a: await authOf(secret), pub,
      pk: b64u(await seal(await hkdf(secret, 'fs1|priv'), pkcs8, 'pk')),
      kw: await wrapKey(pub, K), secret,
    };
  }
  async function privOf(secret, pk) {
    const pkcs8 = await unseal(await hkdf(secret, 'fs1|priv'), unb64u(pk), 'pk');
    return CS.importKey('pkcs8', pkcs8, ECDH, false, ['deriveBits']);
  }
  /* Datenschlüssel eines Zugangs auspacken */
  async function openCred(secret, cred) {
    const priv = await privOf(secret, cred.pk);
    const kw = JSON.parse(cred.kw);
    return { v: kw.v, raw: await openFrom(priv, kw, 'k' + kw.v) };
  }

  /* Schlüsselbund: aktueller Schlüssel und über die Kette alle früheren (nach «Schlüssel erneuern») */
  const KR = { cur: 0, keys: new Map(), raw: new Map() };
  async function setKeyring(top, chain) {
    KR.keys = new Map(); KR.raw = new Map(); KR.cur = top.v;
    let v = top.v, raw = u8(top.raw);
    for (;;) {
      KR.raw.set(v, raw); KR.keys.set(v, await aesKey(raw));

function bindTree() {

}

  if (S.isAdmin && v === 'members') return openMembers();

  if (v === 'gedcom') return exportGedcom();
  if (v === 'trash') return openTrash();

  if (v === 'delete' && S.isAdmin) return deleteTree();

async function deleteTree() {
  const t = curTree(); if (!t) return;
  const np = S.people.size, nf = S.photos.size;
  const ok = await confirmDialog({ title: `«${t.name}» löschen?`, text: `${np} ${np === 1 ? 'Person' : 'Personen'} und ${nf} ${nf === 1 ? 'Foto' : 'Fotos'} werden gelöscht, die Fotodateien landen im Papierkorb von Google Drive. Erstelle vorher eine Sicherung, falls du die Angaben behalten möchtest.`, ok: 'Endgültig löschen', danger: true });
  if (!ok) return;
  const tid = S.treeId;
  for (const ph of [...G.photos.values()]) if (ph.treeId === tid) { remove('photos', ph.id); dropPhotoFiles(ph); }
  for (const st of [...G.stories.values()]) if (st.treeId === tid) { remove('stories', st.id); if (st.audio) Q.blobs.add(st.audio); }
  for (const [id, e] of [...TRASH]) if (e.o.treeId === tid) finalDelete(id);
  for (const p of [...G.people.values()]) if (p.treeId === tid) remove('people', p.id);
  remove('trees', tid);
  LS.set('tree', '');
  S.treeId = null; pickTree(); changed();
  toast('Stammbaum gelöscht');
}

/* ---------- Mitglieder und Zugriff (nur Admins) ---------- */
const APK_URL = 'https://github.com/Cokakula/familienstammbaum-app/releases/latest/download/Familienstammbaum.apk';
const ROLE_DE = { view: 'Ansehen', edit: 'Bearbeiten', admin: 'Admin' };
const ROLE_INFO = { view: 'Kann alles ansehen, aber nichts ändern.', edit: 'Kann Personen und Fotos hinzufügen und ändern.', admin: 'Kann zusätzlich Mitglieder einladen und Rechte vergeben.' };
const ROLE_ORDER = { admin: 0, edit: 1, view: 2 };
const credOut = c => ({ id: c.id, a: c.a, pub: c.pub, pk: c.pk, kw: c.kw, m: c.m });
function waLink(text) { return 'https://wa.me/?text=' + encodeURIComponent(text); }
function mailLink(subject, text) { return 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(text); }
function appLink() { return EXEC || S.execUrl || ''; }
function openLink() { const ex = appLink(); return ex ? `${webBase()}?g=${encodeURIComponent(paramOfExec(ex))}` : webBase(); }
function secretLink(kind, secret) { return `${openLink()}#${kind}=${secret}`; }
function inviteText(link) {
  const t = curTree(); const n = t ? t.name : 'Familienstammbaum';
  return `Du bist zum Familienstammbaum «${n}» eingeladen. Je ftuar në trungun familjar «${n}».\n\nÖffne den Link auf dem Handy oder Computer, auf dem du den Stammbaum benutzen möchtest. Tipp: danach im Browser «Zum Home-Bildschirm» bzw. «Zum Startbildschirm hinzufügen».\nAndroid, auf Wunsch als App mit Geburtstags-Erinnerungen: ${APK_URL} (dann den Link lange drücken → Teilen → Stammbaum)\n\nDein persönlicher Link (funktioniert nur einmal, bitte nicht weitergeben):\n${link}`;
}
function memberInitials(name) { const parts = String(name || '?').trim().split(/[\s@.]+/); return ((parts[0] || '?')[0] + ((parts[1] || '')[0] || '')).toUpperCase(); }
function fmtSeen(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? `${m[3]}.${m[2]}.${m[1]}` : ''; }
function shareText(text) {
  if (NATIVE && NATIVE.shareText) { NATIVE.shareText(text); return true; }
  if (navigator.share) { navigator.share({ text }).catch(() => {}); return true; }
  return false;
}
async function loadCreds() {
  const r = await api('apiCreds');
  if (r.url) S.execUrl = r.url;
  const list = [];
  for (const c of r.creds) { const meta = await FSC.decMeta(c.id, c.m); list.push(Object.assign({}, c, { meta, name: meta.name || '' })); }
  return list;
}
async function createInvite(name, role, replaceId, me) {
  const secret = FSC.b64u(FSC.rnd(32));
  const c = await FSC.makeCred(secret, FSC.curKey(), replaceId);
  c.m = await FSC.encMeta(c.id, me && Object.keys(me).length ? { name, me } : { name });
  await api('apiAddCred', Object.assign(credOut(c), { r: role, s: 'inv' }));
  return { id: c.id, name, role, link: secretLink('i', secret) };
}
async function openMembers() {

/* Schlüssel erneuern: neuer Datenschlüssel für alle verbleibenden Zugänge, alle Einträge neu verschlüsselt */
async function rotateKeys() {

  try {
    await flush();
    if (hasPending()) throw { code: 'user', message: 'Bitte zuerst speichern (keine Verbindung).' };
    const r = await api('apiCreds');

    const metas = {};

    const { nk, chain } = await FSC.nextKey();
    const kws = {};
    for (const c of r.creds) kws[c.id] = await FSC.wrapKey(c.pub, nk);
    const newChain = Object.assign({}, oldChain, { [old.v]: chain });
    await FSC.setKeyring(nk, newChain);
    try {
      const ms = {};
      for (const c of r.creds) if (metas[c.id] && Object.keys(metas[c.id]).length) ms[c.id] = await FSC.encMeta(c.id, metas[c.id]);
      const putArr = [];
      for (const kind of ['trees', 'people', 'photos', 'stories']) for (const o of G[kind].values()) putArr.push(await encryptEntry(kind, o));
      for (const [, e] of TRASH) putArr.push(await encryptEntry(e.kind, e.o));
      await api('apiRotate', { from: old.v, to: nk.v, chain, kws, ms, put: putArr });
      S.chain = newChain;
    } catch (e) { await FSC.setKeyring(old, oldChain); throw e; }
    syncNative();
    toast('Schlüssel erneuert');
  } finally { S.busy = ''; hideBusy(); }
}

function kinPath(a, b) {

/* ---------- Erinnerung an die Sicherung (für Admins, wenn die letzte über einen Monat alt ist) ---------- */
const BACKUP_DAYS = 30;
function lastBackupAt() { let m = +(LS.get('lastBackup') || 0) || 0; G.trees.forEach(t => { if ((t.lastBackup || 0) > m) m = t.lastBackup; }); return m; }
function backupDue() {
  if (!S.isAdmin || !S.loaded || !G.people.size) return null;
  const last = lastBackupAt(), now = Date.now();
  if (last && now - last < BACKUP_DAYS * 864e5) return null;
  if (!last) { let first = now; G.people.forEach(p => { if (p.createdAt && p.createdAt < first) first = p.createdAt; }); if (now - first < 3 * 864e5) return null; }
  return { last, days: last ? Math.floor((now - last) / 864e5) : 0 };
}
function backupText(d) { return d.last ? `Die letzte Sicherung ist ${d.days} Tage alt (${fmtDate(isoOf(new Date(d.last)), true)}).` : 'Es gibt noch keine Sicherung.'; }
let backupAsked = false, backupTries = 0;
async function maybeRemindBackup() {
  if (backupAsked || S.migrating || S.claimFlow) return;
  if (layers.length) { if (++backupTries < 12) setTimeout(() => { maybeRemindBackup().catch(() => {}); }, 15000); return; }
  const d = backupDue(); if (!d) return;
  if (!S.askBackup && Date.now() < (+(LS.get('bkSnooze') || 0) || 0)) return;
  S.askBackup = false;
  backupAsked = true;
  const v = await dialog(`<div class="dlg-title">Zeit für eine Sicherung</div>
    <div class="dlg-text">${esc(backupText(d))} Eine Sicherung auf deinem Gerät schützt den Stammbaum, falls beim Google-Konto etwas schiefgeht. Sie ist verschlüsselt und lässt sich nur mit dem Notfall-Schlüssel öffnen.</div>
    <div class="dlg-btns"><button type="button" class="btn" data-v="later">In einer Woche</button><button type="button" class="btn primary" data-v="now">Jetzt sichern</button></div>`);
  if (v === 'now') return act(backupToDevice);
  LS.set('bkSnooze', String(Date.now() + 7 * 864e5));
}
function backupBanner() {
  const d = backupDue(); if (!d) return '';
  return `<button type="button" class="news-banner warn" data-act="backup-now">${I.save}<span>Sicherung fällig<small>${esc(backupText(d))}</small></span>${I.chevR}</button>`;
}

let undoTimer = 0;
function toastUndo(msg, fn) {

async function restoreEntry(id) {
  const e = TRASH.get(id); if (!e) return;
  const { _del, _by, _links, ...o } = e.o;
  TRASH.delete(id);
  put(e.kind, o);
  if (e.kind === 'people' && _links) {
    (_links.kids || []).forEach(k => { const c = G.people.get(k); if (!c) return; const cur = (c.parentIds || []).filter(x => S.people.has(x)); if (!cur.includes(id) && cur.length < 2) put('people', { ...c, parentIds: [...cur, id] }); });
    (_links.partners || []).forEach(q => { if (G.people.has(q)) { addPartnerRef(q, id); addPartnerRef(id, q); } });
    (_links.photos || []).forEach(f => { const ph = G.photos.get(f); if (ph && !(ph.personIds || []).includes(id)) put('photos', { ...ph, personIds: [...(ph.personIds || []), id] }); });
    const t = G.trees.get(o.treeId); if (_links.home && t && !t.homePersonId) put('trees', { ...t, homePersonId: id });
  }
  if (e.kind === 'photos' && _links) (_links.avatars || []).forEach(pid => { const p = G.people.get(pid); if (p && !p.avatarPhotoId) put('people', { ...p, avatarPhotoId: id }); });

}

function purgeTrash() {

}

/* ---------- Geburtstag: Feuerwerk ---------- */
let fwBusy = false;
function fireworks(anchor) {
  if (fwBusy || reduced) return;
  fwBusy = true;
  const cv = document.createElement('canvas'); cv.className = 'fw-canvas'; cv.setAttribute('aria-hidden', 'true');
  document.body.appendChild(cv);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const r = anchor ? anchor.getBoundingClientRect() : { left: 0, top: 0, width: W, height: H * 0.5 };
  const cx = r.left + r.width / 2, cy = r.top + Math.min(r.height, 260) * 0.42;
  const COLORS = ['#F2C14E', '#F78154', '#E15A97', '#5DB7DE', '#7BD389', '#FFFFFF', '#B28DFF'];
  const parts = [], rockets = [];
  const burst = (x, y) => {
    const col = COLORS[(Math.random() * COLORS.length) | 0], col2 = COLORS[(Math.random() * COLORS.length) | 0];
    const n = 46 + ((Math.random() * 20) | 0);
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.2, sp = 2.2 + Math.random() * 3.2;
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.012 + Math.random() * 0.012, col: i % 3 ? col : col2, size: 1.6 + Math.random() * 1.8 });
    }
  };
  const plan = [[0, -60, 0], [180, 70, -40], [360, -90, -70], [560, 40, 10], [760, -20, -100], [980, 100, -20]];
  const t0 = performance.now();
  plan.forEach(([d, dx, dy]) => rockets.push({ at: d, x: cx + dx, y: H + 10, tx: cx + dx + (Math.random() - 0.5) * 30, ty: Math.max(60, cy + dy), fired: false }));
  let last = t0;
  const step = now => {
    const dt = Math.min(2.2, (now - last) / 16.7); last = now;
    ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const k of rockets) {
      if (now - t0 < k.at || k.done) continue;
      const p = Math.min(1, (now - t0 - k.at) / 420);
      const x = k.x + (k.tx - k.x) * p, y = k.y + (k.ty - k.y) * (1 - (1 - p) * (1 - p));
      ctx.fillStyle = '#FFE8A3'; ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill();
      if (p >= 1) { k.done = true; burst(x, y); }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i];
      q.vx *= 0.985; q.vy = q.vy * 0.985 + 0.045 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= q.decay * dt;
      if (q.life <= 0) { parts.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, q.life); ctx.fillStyle = q.col;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (now - t0 < 3600 || parts.length) requestAnimationFrame(step);
    else { cv.remove(); fwBusy = false; }
  };
  requestAnimationFrame(step);
  setTimeout(() => { if (cv.isConnected) { cv.remove(); fwBusy = false; } }, 7000);
}

    <div class="dlg-text">Damit kommst du als Admin an den Stammbaum, auch wenn alle Geräte weg sind. Du brauchst ihn auch für Sicherungsdateien. Ohne ihn kann niemand die Daten wiederherstellen, auch Google nicht.</div>
    <div class="code-box" data-code>${esc(nice.slice(0, 19))}<br>${esc(nice.slice(20))}</div>
    <div class="dlg-text">Bewahre ihn getrennt vom Handy auf, z.B. im Passwort-Manager oder ausgedruckt. Wer ihn hat, hat Admin-Zugriff.</div>
    <div class="dlg-btns"><button type="button" class="btn" data-v="copy">${I.copy} Kopieren</button>${IN_APP || navigator.share ? '<button type="button" class="btn" data-v="share">Teilen …</button>' : ''}</div>
    <div class="dlg-form"><label class="check"><input type="checkbox" id="rc-ok"> Ich habe den Notfall-Schlüssel sicher aufbewahrt</label></div>
    <div class="dlg-btns"><button type="button" class="btn primary" data-v="done">Weiter</button></div>`, {
    sticky: true,
    map: (v, el) => {
      if (v === 'copy') { copyText(txt); return undefined; }
      if (v === 'share') { shareText(txt); return undefined; }
      if (v === 'done') { if (!el.querySelector('#rc-ok').checked) { toast('Bitte zuerst den Notfall-Schlüssel sichern und das Häkchen setzen.'); return undefined; } return true; }
      return null;
    },
  });
  if (!ok && first) toast('Ohne gesicherten Notfall-Schlüssel: Erstelle im Menü unter «Mitglieder & Zugriff» einen neuen.', false);
}
async function newRecoveryKey() {
  const code = FSC.newRecoveryCode();
  const c = await FSC.makeCred(FSC.normCode(code), FSC.curKey());
  c.m = await FSC.encMeta(c.id, { name: 'Notfall-Schlüssel' });
  await api('apiAddCred', Object.assign(credOut(c), { s: 'rec' }));
  await showRecoveryCode(code);
}
async function enterRecoveryCode() {
  const code = await textPrompt({ title: 'Notfall-Schlüssel eingeben', label: 'Notfall-Schlüssel (32 Zeichen)', placeholder: 'XXXX-XXXX-XXXX-…', ok: 'Öffnen' });
  if (!code) return;
  if (FSC.normCode(code).length !== 32) throw { code: 'user', message: 'Der Notfall-Schlüssel hat 32 Zeichen (Buchstaben und Ziffern 2–7).' };
  S.busy = 'Notfall-Schlüssel wird geprüft …'; S.denied = false; render();
  try { await redeem('r', code); S.busy = ''; S.denyMsg = ''; await load(true); toast('Zugriff wiederhergestellt'); }
  catch (e) { S.busy = ''; S.denied = true; render(); throw e; }
}

/* ---------- Einrichten, Einladung einlösen ---------- */
async function setupTree(name) {
  const K = FSC.newDataKey();
  await FSC.setKeyring(K, {});
  const secret = FSC.b64u(FSC.rnd(32));
  const admin = await FSC.makeCred(secret, K);
  admin.m = await FSC.encMeta(admin.id, { name });
  const code = FSC.newRecoveryCode();
  const rec = await FSC.makeCred(FSC.normCode(code), K);
  rec.m = await FSC.encMeta(rec.id, { name: 'Notfall-Schlüssel' });
  const r = await rawApi('apiSetup', [S.legacyKey || '', credOut(admin), credOut(rec)]);
  if (r && r.url) S.execUrl = r.url;
  saveSession({ id: admin.id, secret });
  return code;
}
async function redeem(kind, raw) {
  const secret = kind === 'r' ? FSC.normCode(raw) : String(raw || '');
  const a = await FSC.authOf(secret);
  const d = await rawApi('apiLoad', [a]);
  if (!d || d.denied || !d.me || (d.me.s !== 'inv' && d.me.s !== 'rec')) {
    throw { code: 'user', message: kind === 'r' ? 'Dieser Notfall-Schlüssel ist nicht gültig.' : 'Dieser Einladungslink ist nicht mehr gültig. Er funktioniert nur einmal. Bitte frag nach einem neuen.' };
  }
  const K = await FSC.openCred(secret, d.cred);
  await FSC.setKeyring(K, d.chain || {});
  const devSecret = FSC.b64u(FSC.rnd(32));
  const dev = await FSC.makeCred(devSecret, K);
  const out = credOut(dev);
  if (kind === 'r') out.m = await FSC.encMeta(dev.id, { name: 'Admin (über Notfall-Schlüssel)' }); else delete out.m;
  const r = await rawApi('apiActivate', [a, out]);
  saveSession({ id: r.id, secret: devSecret });
}

  ppl.forEach(p => {

    if (p.firstName) out.push(`2 GIVN ${tx(p.firstName)}`);
    if (p.lastName) out.push(`2 SURN ${tx(p.lastName)}`);
    if (p.nickname) out.push(`2 NICK ${tx(p.nickname)}`);
    if (p.birthName && p.birthName !== p.lastName) out.push(`1 NAME ${tx(p.firstName)} /${tx(p.birthName)}/`, '2 TYPE birth');
    out.push(`1 SEX ${p.gender === 'm' ? 'M' : p.gender === 'w' ? 'F' : 'U'}`);
    if (p.birthDate || p.birthPlace) { out.push('1 BIRT'); if (p.birthDate) out.push(`2 DATE ${gedDate(p.birthDate)}`); if (p.birthPlace) out.push(`2 PLAC ${tx(p.birthPlace)}`); }
    if (isDead(p)) { out.push(p.deathDate || p.deathPlace ? '1 DEAT' : '1 DEAT Y'); if (p.deathDate) out.push(`2 DATE ${gedDate(p.deathDate)}`); if (p.deathPlace) out.push(`2 PLAC ${tx(p.deathPlace)}`); }
    if (isDead(p) && (p.grave || p.graveGeo)) { out.push('1 BURI'); if (p.grave) out.push(`2 PLAC ${tx(p.grave)}`); if (p.graveGeo) { const [la, lo] = p.graveGeo.split(','); if (!p.grave) out.push('2 PLAC Grab'); out.push('3 MAP', `4 LATI ${+la < 0 ? 'S' : 'N'}${Math.abs(+la)}`, `4 LONG ${+lo < 0 ? 'W' : 'E'}${Math.abs(+lo)}`); } }
    if (p.originPlace) out.push(`1 FACT ${tx(p.originPlace)}`, '2 TYPE Herkunftsort');
    if (p.fis) out.push(`1 FACT ${tx(p.fis)}`, '2 TYPE Fis');
    if (p.address || p.phone || p.email) { out.push('1 RESI'); if (p.address) out.push(...multi(2, 'ADDR', p.address)); if (p.phone) out.push(`2 PHON ${tx(p.phone)}`); if (p.email) out.push(`2 EMAIL ${tx(p.email)}`); }
    if (p.job) { out.push(`1 OCCU ${tx(p.job)}`); if (p.employer) out.push(`2 CORP ${tx(p.employer)}`); }
    if (p.notes) out.push(...multi(1, 'NOTE', p.notes));
    fams.forEach((f, k) => { if (f.kids.includes(p.id)) out.push(`1 FAMC ${fid.get(k)}`); if (f.ids.includes(p.id)) out.push(`1 FAMS ${fid.get(k)}`); });
  });
  fams.forEach((f, k) => {
    out.push(`0 ${fid.get(k)} FAM`);

    if (!b) out.push(P(a)?.gender === 'w' ? `1 WIFE ${iid.get(a)}` : `1 HUSB ${iid.get(a)}`);

    for (const ph of G.photos.values()) { if (ph.full) ids.add(ph.full); if (ph.thumb) ids.add(ph.thumb); }
    for (const st of G.stories.values()) if (st.audio) ids.add(st.audio);
    const list = [...ids], files = [];
    for (let i = 0; i < list.length; i += 8) {
      showBusy(`Fotos werden gesichert: ${Math.min(i + 8, list.length)} von ${list.length}`);
      const res = await api('apiGetBlobs', list.slice(i, i + 8));
      for (const id of list.slice(i, i + 8)) if (res && res[id]) files.push({ name: 'b/' + id, data: FSC.unb64(res[id]) });
    }
    const manifest = { format: 'familienstammbaum-sicherung', version: 2, createdAt: new Date().toISOString(), rec: { pub: rc.pub, pk: rc.pk, box }, e: d.e || [] };
    const zip = makeZip([{ name: 'familienstammbaum.json', data: FSC.TE.encode(JSON.stringify(manifest)) }, ...files]);
    hideBusy();
    const ok = await saveFile(`Familienstammbaum-Sicherung-${isoOf(new Date())}.zip`, zip);
    if (ok) {
      const now = Date.now();
      LS.set('lastBackup', String(now));
      for (const t of [...G.trees.values()]) put('trees', { ...t, lastBackup: now });
      changed();
      toast(`Sicherung gespeichert (${fmtBytes(zip.size)}). Öffnen lässt sie sich nur mit dem Notfall-Schlüssel.`);
    }
  } finally { hideBusy(); }
}
function pickBackupFile() {
  return new Promise(res => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.zip,application/zip'; inp.hidden = true;
    inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; inp.remove(); res(f ? act(() => restoreBackup(f)) : null); });
    document.body.appendChild(inp); inp.click();
  });
}
async function restoreBackup(file) {
  const files = await readZip(file);
  const j = files.get('familienstammbaum.json');
  let man = null;
  try { man = j ? JSON.parse(FSC.TD.decode(j)) : null; } catch (e) { man = null; }
  if (!man || man.format !== 'familienstammbaum-sicherung' || !man.rec) throw { code: 'user', message: 'Das ist keine verschlüsselte Sicherung des Familienstammbaums.' };
  const code = await textPrompt({ title: 'Notfall-Schlüssel der Sicherung', label: 'Notfall-Schlüssel (32 Zeichen)', placeholder: 'XXXX-XXXX-XXXX-…', ok: 'Weiter' });
  if (!code) return;
  let ring;
  try {
    const priv = await FSC.privOf(FSC.normCode(code), man.rec.pk);
    const r = JSON.parse(FSC.TD.decode(await FSC.openFrom(priv, man.rec.box, 'sicherung')));
    ring = await FSC.ringFrom(r.keys);
  } catch (e) { throw { code: 'user', message: 'Der Notfall-Schlüssel passt nicht zu dieser Sicherung.' }; }
  const objs = []; let bad = 0;
  for (const [id, x] of man.e || []) {
    try { const o = await FSC.decWith(ring, id, x); const kind = CODE_KIND[o.k]; if (!kind || o._del) continue; delete o.k; o.id = id; objs.push([kind, o]); }
    catch (e) { bad++; }
  }
  const cnt = k => objs.filter(x => x[0] === k).length;
  const when = man.createdAt ? fmtDate(String(man.createdAt).slice(0, 10), true) : '';
  const ok = await confirmDialog({ title: 'Sicherung einspielen?', text: `Sicherung${when ? ` vom ${when}` : ''}: ${cnt('trees')} Stammbäume, ${cnt('people')} Personen, ${cnt('photos')} Fotos${cnt('stories') ? `, ${cnt('stories')} Erinnerungen` : ''}. Einträge, die es schon gibt, werden durch die Sicherung ersetzt.${bad ? ` ${bad} Einträge waren nicht lesbar.` : ''}`, ok: 'Einspielen' });
  if (!ok) return;
  try {
    const blobIds = [...files.keys()].filter(n => n.startsWith('b/')).map(n => n.slice(2));
    const have = new Set();
    for (let i = 0; i < blobIds.length; i += 200) (await api('apiHasBlobs', blobIds.slice(i, i + 200))).forEach(x => have.add(x));
    const up = blobIds.filter(id => !have.has(id));
    let n = 0;
    for (const id of up) { showBusy(`Fotos werden hochgeladen: ${++n} von ${up.length}`); await api('apiPutBlob', id, FSC.b64(files.get('b/' + id))); }
    showBusy('Einträge werden verschlüsselt gespeichert …');
    quietPut = true; try { for (const [kind, o] of objs) put(kind, o); } finally { quietPut = false; }
    await flush();
    if (hasPending()) throw { code: 'user', message: 'Speichern hat nicht geklappt. Bitte nochmals versuchen.' };
  } finally { hideBusy(); }
  await load(false);
  toast('Sicherung eingespielt');
}

/* ---------- Laden ---------- */
let lastLoad = 0;
function pickTree() {
  if (S.treeId && G.trees.has(S.treeId)) return;
  const saved = LS.get('tree');
  switchTree(saved && G.trees.has(saved) ? saved : (sortedTrees()[0]?.id || null));
}
function switchTree(id) {
  if (id === S.treeId) { rebuild(); scheduleRender(); return; }
  S.treeId = id;
  S.nachRoot = S.vorPerson = S.famPerson = S.focusId = null; S.centeredFor = null; S.q = '';
  if (id) LS.set('tree', id);
  rebuild(); scheduleRender();
}
async function load(initial) {
  const timer = initial ? setTimeout(() => { if (!S.loaded) { S.slow = true; scheduleRender(); } }, 6000) : 0;
  try {
    const sess = loadSession();
    if (!sess) { await resolveAccess(); return; }
    S.auth = await FSC.authOf(sess.secret);
    const d = await api('apiLoad');
    if (!d || d.denied || !d.me || d.me.s !== 'dev') {
      clearSession(); S.denied = true; S.loaded = false; S.denyMsg = 'Dieses Gerät hat keinen Zugriff mehr. Bitte frag nach einer neuen Einladung.';
      G.trees = new Map(); G.people = new Map(); G.photos = new Map(); rebuild(); scheduleRender(); return;
    }
    if (d.url) S.execUrl = d.url;
    const K = await FSC.openCred(sess.secret, d.cred);
    await FSC.setKeyring(K, d.chain || {});
    S.chain = d.chain || {};
    const myMeta = await FSC.decMeta(d.me.id, d.cred.m);
    S.me = { id: d.me.id, role: d.me.r, name: myMeta.name || '', meta: myMeta };
    S.role = d.me.r; S.canWrite = S.role !== 'view'; S.isAdmin = S.role === 'admin';
    const pend = [...Q.put].map(([id, kind]) => [id, kind, entryFor(id, kind)]);
    const fresh = { trees: new Map(), people: new Map(), photos: new Map(), stories: new Map() };
    TRASH.clear();
    let bad = 0;
    await Promise.all((d.e || []).map(async ([id, x]) => {
      try { const o = await FSC.dec(id, x); const kind = CODE_KIND[o.k]; delete o.k; o.id = id; if (!kind) return; if (o._del) TRASH.set(id, { kind, o }); else fresh[kind].set(id, o); }
      catch (e) { bad++; }
    }));
    G.trees = fresh.trees; G.people = fresh.people; G.photos = fresh.photos; G.stories = fresh.stories;
    pend.forEach(([id, kind, o]) => { if (!o) return; if (o._del) { G[kind].delete(id); TRASH.set(id, { kind, o }); } else { TRASH.delete(id); G[kind].set(id, o); } });
    Q.del.forEach(id => { G.trees.delete(id); G.people.delete(id); G.photos.delete(id); G.stories.delete(id); TRASH.delete(id); });
    BK.clear(); G.photos.forEach(noteBlobKeys);
    if (bad) console.warn(bad + ' Einträge konnten nicht entschlüsselt werden');
    S.denied = false; S.needClaim = false; S.denyMsg = '';
    S.loaded = true; S.loadError = null; S.slow = false; lastLoad = Date.now();
    S.legacyLeft = !!d.legacy;
    if (S.treeId && !G.trees.has(S.treeId)) S.treeId = null;
    pickTree(); rebuild(); scheduleRender();
    syncNative();
    if (S.openOnLoad) {                                  /* z. B. nach Tippen auf eine Geburtstags-Erinnerung */
      const pp = G.people.get(S.openOnLoad); S.openOnLoad = null;
      if (pp) { if (pp.treeId !== S.treeId) switchTree(pp.treeId); setTimeout(() => openPerson(pp.id), 60); }
    }
    if (S.canWrite) purgeTrash();
    setTimeout(() => { maybeRemindBackup().catch(() => {}); }, 2500);
    if (S.legacyLeft && S.isAdmin && !S.migrating && !S.claimFlow) setTimeout(offerMigration, 500);
    else if (!S.claimFlow && !S.migrating) setTimeout(() => { maybeAskMe().then(birthdayGreeting); }, 700);
  } catch (e) {
    console.warn(e);
    if (e && e.code === 'no_google') S.noGoogle = true;
    if (!S.loaded) S.loadError = e;
    else toast('Aktualisieren hat nicht geklappt.');
    scheduleRender();
  } finally { clearTimeout(timer); }
}
async function resolveAccess() {
  const st = await rawApi('apiStatus', []);
  if (st && st.url) S.execUrl = st.url;
  S.setup = !!(st && st.setup); S.legacy = !!(st && st.legacy);
  S.loaded = false;
  if (!S.setup) S.needClaim = true; else S.denied = true;
  scheduleRender();
}
/* Für die Android-App: Zugang und Geburtstage für die Erinnerungen im Hintergrund */
function syncNative() {
  if (!NATIVE || !NATIVE.saveSession || !S.auth) return;
  try {
    const keys = {}; FSC.KR.raw.forEach((raw, v) => { keys[v] = FSC.b64u(raw); });
    NATIVE.saveSession(JSON.stringify({ exec: EXEC, a: S.auth, cur: FSC.KR.cur, keys, admin: !!S.isAdmin, lastBackup: lastBackupAt() }));
    const trees = {}; G.trees.forEach(t => { trees[t.id] = t.name || ''; });
    const people = [...G.people.values()].filter(p => !isDead(p) && /^\d{4}-\d{2}-\d{2}$/.test(p.birthDate || ''))
      .map(p => ({ id: p.id, name: fullName(p), firstName: callName(p), birthDate: p.birthDate, phone: p.phone || '', tree: trees[p.treeId] || '' }));
    NATIVE.saveBirthdays(JSON.stringify({ ok: true, people }));
  } catch (e) { console.warn(e); }
}
function gasLocation() {
  return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v || {}); } };
    try { google.script.url.getLocation(loc => fin(loc)); } catch (e) { fin({}); }
    setTimeout(() => fin({}), 2500);
  });
}
function hashParams(h) {
  const o = {};
  String(h || '').replace(/^#/, '').split('&').forEach(kv => { const i = kv.indexOf('='); if (i > 0) { try { o[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1)); } catch (e) {} } });
  return o;
}
function linkParts(link) {
  const out = { params: {}, hash: {} };
  try { const u = new URL(link); u.searchParams.forEach((v, k) => { out.params[k] = v; }); out.hash = hashParams(u.hash); } catch (e) {}
  return out;
}
function forgetLink() {
  try {
    if (IN_APP) { if (NATIVE.linkUsed) NATIVE.linkUsed(); }
    else if (IS_WEB) history.replaceState(null, '', location.pathname + (EXEC ? '?g=' + encodeURIComponent(paramOfExec(EXEC)) : ''));
    else if (window.google && google.script && google.script.history) google.script.history.replace({ layer: 0 }, {}, '');
  } catch (e) {}
}
async function boot() {
  S.view = ['baum', 'personen', 'fotos'].includes(LS.get('view')) ? LS.get('view') : 'baum';
  S.treeMode = ['vor', 'beide'].includes(LS.get('mode')) ? LS.get('mode') : 'nach';
  bindShell(); render();
  let params = {}, hash = {};
  if (IN_APP) {
    let cfg = {};
    try { cfg = JSON.parse(NATIVE.getConfig() || '{}'); } catch (e) { cfg = {}; }
    EXEC = cfg.exec || '';
    if (cfg.reset) clearSession();
    /* Nach dem Update der App: bisherigen Zugang dieses Geräts übernehmen (bleibt auf dem Handy) */
    if (cfg.sess) {
      try { const old = JSON.parse(cfg.sess); if (old && old.secret && !LS.get('sess')) LS.set('sess', cfg.sess); } catch (e) {}
      try { if (NATIVE.sessionImported) NATIVE.sessionImported(); } catch (e) {}
    }
    if (cfg.link) { const L = linkParts(cfg.link); params = L.params; hash = L.hash; }
    if (cfg.person) params.p = cfg.person;
    if (cfg.backup) S.askBackup = true;
    if (!EXEC) { S.noGoogle = true; render(); return; }
  } else if (HAS_GAS) {
    const loc = await gasLocation();
    params = (loc && loc.parameter) || {}; hash = hashParams(loc && loc.hash);
  } else if (IS_WEB) {
    new URLSearchParams(location.search).forEach((v, k) => { params[k] = v; });
    hash = hashParams(location.hash);
    EXEC = execFromParam(params.g) || LS.get('exec') || '';
    if (!EXEC) { S.noGoogle = true; render(); return; }
    LS.set('exec', EXEC);
  } else { S.noGoogle = true; render(); return; }
  /* erst nach dem Lesen der Adresse: Verlauf zurücksetzen (Google kann dabei die Adresse ändern) */
  try { if (GH) GH.replace({ layer: 0 }); else if (history.state && history.state.layer) history.replaceState(null, ''); } catch (e) {}
  S.openOnLoad = params.p || null;
  S.legacyKey = params.k || '';
  const kind = hash.i ? 'i' : hash.r ? 'r' : '';
  /* iPhone: Home-Bildschirm-Apps haben eigenen Speicher. Die Einladung dort einlösen, wo man den Stammbaum künftig öffnet. */
  let iosGo = false; try { iosGo = sessionStorage.getItem('iosGo') === '1'; } catch (e) {}
  if (kind === 'i' && IS_WEB && IS_IOS && !STANDALONE && !iosGo && !loadSession()) {
    const v = await dialog(`<div class="dlg-title">Auf dem iPhone als App?</div>
      <div class="dlg-text">Du kannst den Stammbaum als Symbol auf den Home-Bildschirm legen. Dann öffnet er sich wie eine App. Die Einladung funktioniert nur einmal; löse sie dort ein, wo du den Stammbaum künftig öffnest.</div>
      <div class="dlg-btns"><button type="button" class="btn" data-v="browser">Im Browser öffnen</button><button type="button" class="btn primary" data-v="home">Als App hinzufügen</button></div>`, { sticky: true });
    if (v === 'home') { S.iosHint = true; render(); return; }
  }
  let keepLink = false;
  if (kind) {
    let go = true;
    if (loadSession()) go = await confirmDialog({ title: kind === 'i' ? 'Einladung einlösen?' : 'Notfall-Schlüssel verwenden?', text: 'Dieses Gerät hat schon Zugriff auf einen Stammbaum. Der bisherige Zugang auf diesem Gerät wird dabei ersetzt.', ok: 'Einlösen' });
    if (go) {
      S.busy = kind === 'i' ? 'Einladung wird eingelöst …' : 'Notfall-Schlüssel wird geprüft …'; render();
      try { clearSession(); await redeem(kind, hash[kind]); toast(kind === 'i' ? 'Willkommen! Dieses Gerät hat jetzt Zugriff.' : 'Zugriff wiederhergestellt'); }
      catch (e) {
        S.denyMsg = (e && e.code === 'user' && e.message) || '';
        if (!S.denyMsg) handleErr(e);
        if (e && (e.code === 'net' || e.code === 'no_google')) keepLink = true;   /* ohne Verbindung: Link behalten, später nochmals */
      }
      finally { S.busy = ''; }
    }
    if (!keepLink) forgetLink();
  }
  load(true);
}
boot();
})();
</script>
